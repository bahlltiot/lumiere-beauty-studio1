services:
  - type: web
    name: lumiere-beauty-studio
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data/lumiere
      - key: DEMO_RESET_LINK
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: TZ
        value: Europe/Moscow
